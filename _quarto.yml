project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - pages/hrl_infrastructure_proposal.qmd
    - pages/map_memo.qmd
    - pages/data_pipeline_architecture.qmd
    - pages/repository_structure.qmd
    - pages/posit_platform.qmd

execute:
  freeze: auto

website:
  title: "HRL Data Infrastructure"
  bread-crumbs: false
  page-navigation: true

  navbar:
    right:
      - icon: github
        aria-label: "HRL Data Infrastructure on GitHub"
        href: https://github.com/lucy-dwr/hrl-data-infrastructure

  sidebar:
    style: "docked"
    search: true
    collapse-level: 3
    contents:
      - href: index.qmd
        text: "Home"
      - section: "Architecture"
        contents:
          - href: pages/data_pipeline_architecture.qmd
            text: "Data Pipeline Architecture"
          - href: pages/posit_platform.qmd
            text: "Posit Data Science Platform"
      - section: "Repositories & code"
        contents:
          - href: pages/repository_structure.qmd
            text: "Repository structure"
      - section: "Archive"
        contents:
          - href: pages/hrl_infrastructure_proposal.qmd
            text: "Infrastructure Proposal"
          - href: pages/map_memo.qmd
            text: "Restoration Project Map"

  page-footer:
    left:
      - text: '<span class="footer-draft-note">Disclaimer: this site is currently published in draft form, aligned with HRL''s commitment to open source work, and should not be cited as authoritative HRL policy.</span>'
    right:
      - icon: github
        aria-label: "HRL Data Infrastructure on GitHub"
        href: https://github.com/lucy-dwr/hrl-data-infrastructure

format:
  html:
    grid:
      sidebar-width: 300px
    theme:
      - sandstone
      - theme/dwr-overrides.scss
    css: styles.css
    toc: true
    mermaid:
      theme: neutral
